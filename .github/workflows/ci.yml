name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "28"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore the test build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-test-${{ hashFiles('mix.lock') }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run the project precommit checks
        run: mix precommit

      - name: Ensure checks did not rewrite tracked files
        run: git diff --exit-code

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore the Dialyzer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-dialyzer-${{ hashFiles('mix.lock') }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  release-smoke:
    name: Headless release smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore the release smoke cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build/test
            _build/prod
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-release-smoke-${{ hashFiles('mix.lock') }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Exercise the packaged headless release
        run: mix test.release

  production-build:
    name: macOS production compile and assets
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MIX_ENV: prod

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore the production build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build/prod
            _build/esbuild-*
            _build/tailwind-*
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-prod-${{ hashFiles('mix.lock') }}

      - name: Fetch production dependencies
        run: mix deps.get --only prod

      - name: Install asset toolchains
        run: mix assets.setup

      - name: Compile production with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Build minified production assets
        run: mix assets.deploy

      - name: Verify generated asset entrypoints
        run: |
          test -s apps/catalyst_web/priv/static/assets/css/app.css
          test -s apps/catalyst_web/priv/static/assets/js/app.js

  portable-release:
    name: Portable release (${{ matrix.name }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    env:
      CATALYST_RELEASE_PLAIN: "1"
      MIX_ENV: prod

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore the portable release cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build/prod
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-portable-release-${{ hashFiles('mix.lock') }}

      - name: Fetch production dependencies
        run: mix deps.get --only prod

      - name: Assemble the native OTP release
        run: mix release catalyst_cli --overwrite

      - name: Boot and exercise the release
        if: runner.os != 'Windows'
        shell: bash
        env:
          CATALYST_HOME: ${{ runner.temp }}/catalyst-release-smoke
        run: |
          release="_build/prod/rel/catalyst_cli/bin/catalyst_cli"
          test -x "${release}"
          "${release}" eval 'Code.require_file("rel/ci_release_smoke.exs")'

      - name: Boot and exercise the Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CATALYST_HOME: ${{ runner.temp }}/catalyst-release-smoke
        run: |
          $release = "_build/prod/rel/catalyst_cli/bin/catalyst_cli.bat"

          if (-not (Test-Path -Path $release -PathType Leaf)) {
            throw "Missing release entrypoint: $release"
          }

          & $release eval 'Code.require_file("rel/ci_release_smoke.exs")'

          if ($LASTEXITCODE -ne 0) {
            throw "Release smoke test exited with status $LASTEXITCODE"
          }
